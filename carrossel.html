<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: transparent; }

  .carousel {
    position: relative;
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 12px;
    background: #f0f0f0;
  }

  .carousel-track {
    display: flex;
    transition: transform 0.45s ease;
    will-change: transform;
  }

  .carousel-slide {
    flex: 0 0 100%;
    width: 100%;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e8e8e8;
  }

  .carousel-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 2;
  }
  .carousel-btn:hover { background: rgba(0,0,0,0.7); }
  .carousel-btn.prev { left: 12px; }
  .carousel-btn.next { right: 12px; }

  .carousel-dots {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 2;
  }
  .carousel-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background 0.2s, transform 0.2s;
  }
  .carousel-dot.active {
    background: #fff;
    transform: scale(1.25);
  }

  .carousel-empty {
    padding: 40px;
    text-align: center;
    color: #666;
  }
</style>
</head>
<body>

<div class="carousel" id="carousel">
  <div class="carousel-track" id="track"></div>
  <button class="carousel-btn prev" id="prevBtn" aria-label="Anterior">&#10094;</button>
  <button class="carousel-btn next" id="nextBtn" aria-label="Seguinte">&#10095;</button>
  <div class="carousel-dots" id="dots"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const API_URL = params.get('api');

  const AUTOPLAY_MS = 4000; // tempo entre slides (0 para desativar)

  const track    = document.getElementById('track');
  const dotsWrap = document.getElementById('dots');
  const prevBtn  = document.getElementById('prevBtn');
  const nextBtn  = document.getElementById('nextBtn');
  const carousel = document.getElementById('carousel');

  let slides = [];
  let current = 0;
  let autoplayTimer = null;

  async function init() {
      if (!API_URL) {
      carousel.innerHTML = '<div class="carousel-empty">Parâmetro <code>?api=</code> em falta no URL.</div>';
      return;
    }

    try {
      const res = await fetch(API_URL);
      const data = await res.json();

      // Filtrar itens de erro e sem imagem
      slides = data.filter(item => !item.error && item.imageUrl);

      if (slides.length === 0) {
        carousel.innerHTML = '<div class="carousel-empty">Nenhuma imagem disponível.</div>';
        return;
      }

      render();
      goTo(0);
      startAutoplay();

    } catch (err) {
      carousel.innerHTML = '<div class="carousel-empty">Erro ao carregar o carrossel.</div>';
      console.error(err);
    }
  }

  function render() {
    track.innerHTML = slides.map(item => `
      <div class="carousel-slide">
        <img src="${item.imageUrl}" alt="${escapeHtml(item.altText || '')}" loading="lazy">
      </div>
    `).join('');

    dotsWrap.innerHTML = slides.map((_, i) =>
      `<button class="carousel-dot" data-index="${i}" aria-label="Ir para slide ${i + 1}"></button>`
    ).join('');

    dotsWrap.querySelectorAll('.carousel-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        goTo(parseInt(dot.dataset.index, 10));
        restartAutoplay();
      });
    });
  }

  function goTo(index) {
    current = (index + slides.length) % slides.length;
    track.style.transform = `translateX(-${current * 100}%)`;

    dotsWrap.querySelectorAll('.carousel-dot').forEach((dot, i) => {
      dot.classList.toggle('active', i === current);
    });
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  function startAutoplay() {
    if (AUTOPLAY_MS <= 0 || slides.length < 2) return;
    autoplayTimer = setInterval(next, AUTOPLAY_MS);
  }

  function stopAutoplay() {
    if (autoplayTimer) { clearInterval(autoplayTimer); autoplayTimer = null; }
  }

  function restartAutoplay() {
    stopAutoplay();
    startAutoplay();
  }

  nextBtn.addEventListener('click', () => { next(); restartAutoplay(); });
  prevBtn.addEventListener('click', () => { prev(); restartAutoplay(); });

  carousel.addEventListener('mouseenter', stopAutoplay);
  carousel.addEventListener('mouseleave', startAutoplay);

  // Suporte a swipe em touch
  let touchStartX = null;
  carousel.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  carousel.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const delta = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(delta) > 40) { delta < 0 ? next() : prev(); restartAutoplay(); }
    touchStartX = null;
  }, { passive: true });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  init();
</script>

</body>
</html>
