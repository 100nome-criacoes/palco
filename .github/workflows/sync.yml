name: Sync to site-source

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout palco
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: 100nome-criacoes
          repositories: site-source

      - name: Push to site-source
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --branch main "https://x-access-token:${TOKEN}@github.com/100nome-criacoes/site-source.git" /tmp/dest
          mkdir -p /tmp/dest/web/palco
          rsync -a --delete --exclude='.git' --exclude='.github' ./ /tmp/dest/web/palco/
          cd /tmp/dest
          git config user.name "100nome-criacoes-sync[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Sync from palco"
          git push origin main
