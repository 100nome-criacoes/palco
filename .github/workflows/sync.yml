name: Sync to site-source

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout palco
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: 100nome-criacoes
          repositories: site-source

      - name: Push to site-source
        uses: nkoppel/push-files-to-another-repository@v1.1.4
        env:
          API_TOKEN_GITHUB: ${{ steps.app-token.outputs.token }}
        with:
          source-files: './'
          destination-username: '100nome-criacoes'
          destination-repository: 'site-source'
          destination-branch: 'main'
          destination-directory: 'web/palco'
          commit-email: '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
